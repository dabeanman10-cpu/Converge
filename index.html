<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Default theme link with an id so JavaScript can change its href -->
    <link id="theme-stylesheet" rel="stylesheet" href="styleslight.css" />

    <style>
      /* Styling for the top-right toggle button */
      .theme-toggle-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 1000;
        padding: 6px 12px;
        font-size: 13px;
        font-weight: bold;
        border: 2px solid #000;
        border-radius: 20px;
        background-color: #ffffff;
        color: #000000;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        transition: all 0.2s ease;
      }

      .theme-toggle-btn:hover {
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <!-- Theme Toggle Button in the Top Right -->
    <button id="theme-toggle" class="theme-toggle-btn">
      🌙 Dark Mode
    </button>

    <div class="headersection">
      <h1 class="hearder-title">Congressional APP</h1>
      <a class="create" href="create.html">Create Project</a>
    </div>

    <h2 class="screen-title">Projects</h2>
    <div class="feed" id="feed"></div>

    <script src="data.js"></script>
    <script src="helpers.js"></script>
    <script src="feed.js"></script>

    <!-- Script to handle switching stylesheets and saving user preference -->
    <script>
      const toggleBtn = document.getElementById('theme-toggle');
      const themeStylesheet = document.getElementById('theme-stylesheet');

      // Check if user previously saved a theme preference
      const savedTheme = localStorage.getItem('theme');

      if (savedTheme === 'dark') {
        themeStylesheet.setAttribute('href', 'stylesdark.css');
        toggleBtn.textContent = '☀️ Light Mode';
      } else {
        themeStylesheet.setAttribute('href', 'styleslight.css');
        toggleBtn.textContent = '🌙 Dark Mode';
      }

      // Handle button click
      toggleBtn.addEventListener('click', () => {
        const currentTheme = themeStylesheet.getAttribute('href');

        if (currentTheme === 'styleslight.css') {
          themeStylesheet.setAttribute('href', 'stylesdark.css');
          toggleBtn.textContent = '☀️ Light Mode';
          localStorage.setItem('theme', 'dark');
        } else {
          themeStylesheet.setAttribute('href', 'styleslight.css');
          toggleBtn.textContent = '🌙 Dark Mode';
          localStorage.setItem('theme', 'light');
        }
      });
    </script>
  </body>
</html>
